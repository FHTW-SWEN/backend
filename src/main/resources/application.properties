spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tourplanner}
spring.datasource.username=${DB_USERNAME:tourplanner}
spring.datasource.password=${DB_PASSWORD:tourplanner}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# .env Datei einlesen (nicht ins Git committen!)
spring.config.import=file:.env[.properties]

# OpenRouteService API Key (kommt aus .env)
openrouteservice.api-key=${OPENROUTESERVICE_API}

# JWT
jwt.secret=${JWT_SECRET:tourplanner-super-secret-key-minimum-256-bits-long!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}

